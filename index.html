<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/school-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>经贸+</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__jmerrs = [];
      function __jmLog(m) { try { console.error('JMERR:' + m); } catch (x) {} }
      window.addEventListener('error', function (e) {
        var m = String(e.message + ' @ ' + (e.filename || '') + ' : ' + e.lineno);
        window.__jmerrs.push(m); __jmLog(m);
        try { localStorage.setItem('jm_errs', JSON.stringify(window.__jmerrs.slice(-5))); } catch (x) {}
      });
      window.addEventListener('unhandledrejection', function (e) {
        var m = 'rej: ' + String(e.reason);
        window.__jmerrs.push(m); __jmLog(m);
        try { localStorage.setItem('jm_errs', JSON.stringify(window.__jmerrs.slice(-5))); } catch (x) {}
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
